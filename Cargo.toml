[package]
name = "snipchord"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
description = "A macOS-style screenshot experience for Linux"

[[bin]]
name = "snipchord"
path = "src/main.rs"

[dependencies]
# Keep the X11 path protocol-level: no toolkit is required for the capture/overlay.
x11rb = { version = "0.13.2", features = ["composite", "image", "randr", "render", "shape", "xinerama"] }
x11-dl = "2.21.0"
png = "0.17.16"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
libc = "0.2.189"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ksni = { version = "0.3.6", default-features = false, features = ["async-io", "blocking"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.dev]
debug = 1
